<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BroPage</title>
<style>
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171717;
  --bg-soft: #202020;
  --card: #1e1e1e;
  --border: #2b2b2b;
  --border-strong: #3a3a3a;
  --text: #d9d9d9;
  --muted: #8f8f8f;
  --tile: #242424;
  --tile-hover: #2e2e2e;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f5;
  --bg-soft: #ececec;
  --card: #ffffff;
  --border: #dedede;
  --border-strong: #b8b8b8;
  --text: #232323;
  --muted: #707070;
  --tile: #ffffff;
  --tile-hover: #f0f0f0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 236px;
  padding: 14px;
  font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

h1 {
  font-size: 13px; font-weight: 600; letter-spacing: .05em;
  margin-bottom: 12px;
}

.row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 10px;
  font-size: 13.5px;
}

input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: #8a8a8a; /* серый вместо системного синего */
}

.seg {
  display: flex;
  margin-left: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.seg button {
  padding: 6px 10px;
  font-size: 12.5px;
  color: var(--muted);
  background: var(--tile);
  transition: background .12s, color .12s;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { color: var(--text); background: var(--tile-hover); }
.seg button.active { background: var(--text); color: var(--bg); }

footer {
  padding-top: 4px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  opacity: .6;
  user-select: none;
}
footer a { color: inherit; text-decoration: none; }
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>BroPage</h1>

  <label class="row">
    <input type="checkbox" id="enabled" checked>
    <span>Включить страницу</span>
  </label>

  <div class="row">
    <span>Тема</span>
    <div class="seg">
      <button type="button" id="themeDark">Тёмная</button>
      <button type="button" id="themeLight">Светлая</button>
    </div>
  </div>

  <footer>by <a id="creditLink" href="https://github.com/vasidor" target="_blank" rel="noopener">vasidor</a></footer>

  <script src="popup.js"></script>
</body>
</html>
